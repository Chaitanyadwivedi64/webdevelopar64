<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PGKM SCHOOL</title>
    <style>
        /* --- Uiverse.io Terminal Loader Styles --- */
        @keyframes blinkCursor {
            50% { border-right-color: transparent; }
        }

        @keyframes typeAndDelete {
            0%, 10% { width: 0; }
            45%, 55% { width: 10em; } 
            90%, 100% { width: 0; }
        }

        .terminal-loader {
            border: 0.1em solid #333;
            background-color: #1a1a1a;
            color: #0f0;
            font-family: "Courier New", Courier, monospace;
            font-size: 1em;
            padding: 1.5em 1em;
            width: 12em;
            margin: 30px auto; 
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            border-radius: 4px;
            position: relative;
            overflow: hidden;
            box-sizing: border-box;
            text-align: left; 
        }

        .terminal-header {
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 1.5em;
            background-color: #333;
            border-top-left-radius: 4px;
            border-top-right-radius: 4px;
            padding: 0 0.4em;
            box-sizing: border-box;
        }

        .terminal-controls { float: right; }

        .control {
            display: inline-block;
            width: 0.6em; height: 0.6em;
            margin-left: 0.4em;
            border-radius: 50%;
            background-color: #777;
        }
        .control.close { background-color: #e33; }
        .control.minimize { background-color: #ee0; }
        .control.maximize { background-color: #0b0; }

        .terminal-title {
            float: left;
            line-height: 1.5em;
            color: #eee;
            font-size: 0.8em;
        }

        .text {
            display: inline-block;
            white-space: nowrap;
            overflow: hidden;
            border-right: 0.2em solid green; 
            animation: typeAndDelete 4s steps(11) infinite,
                       blinkCursor 0.5s step-end infinite alternate;
            margin-top: 1.5em;
        }

        /* --- Global Reset & Background Styling --- */
        @keyframes shadow-pop-tr {
            0% {
                box-shadow: 0 0 #3e3e3e, 0 0 #3e3e3e, 0 0 #3e3e3e, 0 0 #3e3e3e;
                transform: translateX(0) translateY(0);
            }
            100% {
                box-shadow: 1px -1px #3e3e3e, 2px -2px #3e3e3e, 3px -3px #3e3e3e, 4px -4px #3e3e3e;
                transform: translateX(-8px) translateY(8px);
            }
        }

        * { 
            margin: 0; 
            padding: 0; 
            box-sizing: border-box; 
        }

        body {
            font-family: system-ui, -apple-system, sans-serif;
            color: #ffffff;
            background-color: #001f3f;
            overflow-x: hidden;
            min-height: 100vh;
            padding-top: 80px; 
        }

        /* --- School Navigation Bar --- */
        .navbar {
            position: fixed;
            top: 0; left: 0; right: 0;
            height: 70px;
            background: rgba(15, 15, 15, 0.75);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 2rem;
        }

        .nav-logo {
            font-size: 1.4rem;
            font-weight: 700;
            color: #ffffff;
            text-decoration: none;
            letter-spacing: 1px;
        }

        .nav-menu {
            display: flex;
            list-style: none;
            gap: 2rem;
            align-items: center;
        }

        .nav-item a {
            color: rgba(255, 255, 255, 0.8);
            text-decoration: none;
            font-size: 0.95rem;
            font-weight: 500;
            transition: color 0.3s ease;
        }

        .nav-item a:hover {
            color: #FCB216;
        }

        .nav-cta {
            background-color: #FCB216;
            color: #000000 !important;
            padding: 0.5rem 1rem;
            border-radius: 6px;
            font-weight: 600 !important;
            transition: transform 0.2s ease, background-color 0.3s ease !important;
        }

        .nav-cta:hover {
            background-color: #e59d0b !important;
            transform: translateY(-1px);
        }

        /* --- School Main Banner Image Style --- */
        .school-banner-container {
            max-width: 600px;
            margin: 2rem auto 1rem auto;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 8px 24px rgba(0,0,0,0.4);
            border: 1px solid rgba(255, 255, 255, 0.15);
        }

        .school-banner-img {
            width: 100%;
            height: auto;
            display: block;
            object-fit: cover;
        }

        /* --- Moving Dots Canvas Background --- */
        #particle-canvas {
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            z-index: 1;
            pointer-events: none;
        }

        /* --- Main Content Layout --- */
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 40px 20px;
            position: relative;
            z-index: 2;
        }

        .hero {
            text-align: center;
            background: rgba(15, 15, 15, 0.75);
            padding: 4rem 2rem;
            border-radius: 24px;
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            animation: shadow-pop-tr 0.3s cubic-bezier(0.470, 0.000, 0.745, 0.715) both;
        }

        h1 { 
            font-size: 3rem; 
            margin-bottom: 0.5rem; 
        }

        .main-btn { 
            display: inline-block;
            margin-top: 1.5rem;
            border: 2px solid #FCB216; 
            color: #FCB216; 
            padding: 0.5rem 1rem; 
            text-decoration: none; 
            border-radius: 8px; 
            transition: all 0.3s ease;
            font-weight: 600;
        }
        .main-btn:hover {
            background-color: #FCB216;
            color: #000;
        }
    </style>
</head>

    <!-- JavaScript Particle Physics Engine -->
    <script>
        const canvas = document.getElementById('particle-canvas');
        const ctx = canvas.getContext('2d');
        let particles = [];
        const colors = ['#3b82f6', '#ef4444', '#60a5fa', '#f87171', '#1d4ed8'];

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        class Particle {
            constructor() {
                this.reset();
                this.y = Math.random() * canvas.height;
            }
            reset() {
                this.x = Math.random() * canvas.width;
                this.y = canvas.height + Math.random() * 20;
                this.size = Math.random() * 2 + 1;
                this.speedY = -(Math.random() * 0.5 + 0.2);
                this.color = colors[Math.floor(Math.random() * colors.length)];
            }
            update() {
                this.y += this.speedY;
                if (this.y < 0) this.reset();
            }
            draw() {
                ctx.fillStyle = this.color;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        for (let i = 0; i < 100; i++) particles.push(new Particle());
        
        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach(p => { p.update(); p.draw(); });
            requestAnimationFrame(animate);
        }
        animate();
    </script>
